name: Python package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python scripts/smoke-wheel.py
      - run: python -m pip install '.[engine]'
      - run: python -m pytest tests/test_precision_policy.py tests/test_local_quote_integration.py tests/test_local_observation_review.py tests/test_economy_review.py tests/test_public_market_quotes.py tests/test_recommendation_evidence.py tests/test_complete_market_evidence.py tests/test_intraday_evidence.py -q
        working-directory: daily-engine
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: Stock-King-python
          path: dist/*
          if-no-files-found: error
