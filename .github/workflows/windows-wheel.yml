name: Windows desktop wheel
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - '**/README*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - '**/README*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-wheel-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[engine,models]' pyinstaller build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - run: ./scripts/build-backend.ps1 -SkipDependencyInstall
        working-directory: daily-engine
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm test
        working-directory: desktop/frontend
      - run: wails build -clean -platform windows/amd64
        working-directory: desktop
      - run: go test . ./internal/windowstoast
        working-directory: desktop
      - run: python scripts/build-desktop-wheel.py
      - run: python scripts/smoke-wheel.py --native
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-King-windows-x64
          retention-days: 14
          path: dist/desktop/*.whl
          if-no-files-found: error
