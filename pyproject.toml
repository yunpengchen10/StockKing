[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-king"
version = "2.6.0"
description = "Stock King desktop launcher and auditable stock research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_NOTICES.zh-CN.md", "licenses/*",
  "daily-engine/LICENSE", "daily-engine/THIRD_PARTY_NOTICES.md",
  "daily-engine/src/services/screening/LICENSE", "desktop/internal/windowstoast/LICENSE"]
dependencies = ["platformdirs>=4,<5", "tzdata>=2024.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
data = ["akshare>=1.18.0,<2", "pandas>=2,<4", "numpy>=1.26,<3", "requests>=2.31", "python-dotenv>=1", "tenacity>=8", "PyYAML>=6"]
engine = ["akshare>=1.18.0,<2", "pandas>=2,<4", "numpy>=1.26,<3", "requests>=2.31", "python-dotenv>=1", "tenacity>=8", "PyYAML>=6",
  "setuptools>=77,<81", "sqlalchemy>=2", "schedule>=1.2", "exchange-calendars>=4.13",
  "efinance==0.5.9", "tushare>=1.4", "pytdx>=1.72", "baostock>=0.8", "yfinance>=0.2",
  "longbridge>=4.0.5,<5; platform_system != 'Linux'", "tickflow>=0.1.24", "futu-api==10.8.6808",
  "pypinyin>=0.50", "openpyxl>=3.1", "scikit-learn>=1.5", "json-repair>=0.55.1", "orjson>=3.10,<4",
  "litellm>=1.80.10,!=1.82.7,!=1.82.8,<2", "tiktoken>=0.8,<0.12", "openai>=1",
  "tavily-python>=0.3", "google-search-results>=2.4", "markdown2>=2.4", "imgkit>=1.2",
  "fake-useragent>=1.4", "httpx[socks]", "lark-oapi>=1", "dingtalk-stream>=0.24.3",
  "discord.py>=2", "PyNaCl>=1.5", "newspaper3k>=0.2.8", "lxml_html_clean", "jinja2>=3.1",
  "fastapi>=0.109", "uvicorn[standard]>=0.27", "python-multipart>=0.0.6"]
models = ["lightgbm>=4.6", "torch>=2.6; platform_system != 'Darwin' or platform_machine == 'arm64'"]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
stock-king = "stock_king.cli:main"

[project.urls]
Repository = "https://github.com/yunpengchen10/StockKing"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["stock_king*"]

[tool.pytest.ini_options]
testpaths = ["daily-engine/tests"]
pythonpath = ["daily-engine", "python"]
